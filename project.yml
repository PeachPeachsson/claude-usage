name: ClaudeUsageSpike

options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"

targets:
  ClaudeUsageSpike:
    type: application
    platform: iOS
    sources:
      - path: ClaudeUsageSpike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ClaudeUsageSpike
        PRODUCT_NAME: ClaudeUsageSpike
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Claude Usage
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"

  ClaudeUsageSpikeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ClaudeUsageSpikeTests
    dependencies:
      - target: ClaudeUsageSpike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ClaudeUsageSpikeTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ClaudeUsageSpike:
    build:
      targets:
        ClaudeUsageSpike: all
        ClaudeUsageSpikeTests: [test]
    test:
      targets:
        - ClaudeUsageSpikeTests

